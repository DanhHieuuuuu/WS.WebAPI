services:
  ws.webapi:
    image: ${DOCKER_REGISTRY-}wswebapi
    build:
      context: .
      dockerfile: WS.WebAPI/Dockerfile
    ports:
      - "5000:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Data Source=host.docker.internal;Initial Catalog=BaiTap;User ID=sa;Password=yourStrong(!)Password;Trust Server Certificate=True
    networks:
      - mynetwork
networks:
  mynetwork:
    driver: bridge
